<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Flat lattice panel — top-down view, blue -->
  <rect x="4" y="4" width="56" height="56" rx="4"
        fill="#2e86c1" stroke="#1a5276" stroke-width="2"/>
  <!-- Hex grid cells -->
  <polygon points="32,18 38,22 38,30 32,34 26,30 26,22"
           fill="none" stroke="#aed6f1" stroke-width="1.8"/>
  <polygon points="18,10 24,14 24,22 18,26 12,22 12,14"
           fill="none" stroke="#aed6f1" stroke-width="1.8"/>
  <polygon points="46,10 52,14 52,22 46,26 40,22 40,14"
           fill="none" stroke="#aed6f1" stroke-width="1.8"/>
  <polygon points="18,26 24,30 24,38 18,42 12,38 12,30"
           fill="none" stroke="#aed6f1" stroke-width="1.8"/>
  <polygon points="46,26 52,30 52,38 46,42 40,38 40,30"
           fill="none" stroke="#aed6f1" stroke-width="1.8"/>
  <polygon points="32,34 38,38 38,46 32,50 26,46 26,38"
           fill="none" stroke="#aed6f1" stroke-width="1.8"/>
  <!-- Orange slice / cut line -->
  <line x1="4" y1="32" x2="60" y2="32"
        stroke="#f39c12" stroke-width="2" stroke-dasharray="4,3"/>
</svg>
