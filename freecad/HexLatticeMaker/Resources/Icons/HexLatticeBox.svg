<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Open-top box — simple isometric view -->
  <!-- Bottom face (parallelogram, lighter orange) -->
  <polygon points="8,42 32,52 56,42 32,32"
           fill="#e67e22" stroke="#a04000" stroke-width="1.5"/>
  <!-- Left face (tall parallelogram) -->
  <polygon points="8,20 8,42 32,52 32,30"
           fill="#d35400" stroke="#a04000" stroke-width="1.5"/>
  <!-- Right face (tall parallelogram) -->
  <polygon points="32,30 32,52 56,42 56,20"
           fill="#e59866" stroke="#a04000" stroke-width="1.5"/>
  <!-- Front-left top edge (open top indicator) -->
  <line x1="8"  y1="20" x2="32" y2="10" stroke="#a04000" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="32" y1="10" x2="56" y2="20" stroke="#a04000" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Hex pattern hint on right (lighter) face -->
  <polygon points="42,34 46,36 46,41 42,43 38,41 38,36"
           fill="none" stroke="#a04000" stroke-width="1.2" opacity="0.7"/>
  <!-- Hex pattern hint on left (darker) face -->
  <polygon points="15,32 19,34 19,39 15,41 11,39 11,34"
           fill="none" stroke="#f0b27a" stroke-width="1.2" opacity="0.8"/>
  <!-- Top rim highlight showing open top -->
  <polygon points="8,20 32,30 56,20 32,10"
           fill="none" stroke="#f39c12" stroke-width="1.8"/>
</svg>
